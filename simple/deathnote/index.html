<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DEATH NOTE</title>
        <link rel="stylesheet" href="styles/main.css">
        <script src="js/main.js"></script>
    </head>
    <body id="mainPage">
        <header>
            <h1 id="pageHeader">DEATH NOTE</h1>
        </header>
        <main>
            <textarea id="rules" class="rules">   The human whose name is written in this note 
shall die.
    This note will not take effect unless the writer
has the person's face in their
mind when writing his/her name. Therefore, people sharing the same name will
not be affected.
    If the cause of death is written within the next
40 seconds of writing the person's name, it will happen.
    If the cause of death is not specified, the
person will simply die of a heart attack.
    After writing the cause of death, details of the
death should be written in the next 6 minutes and 40 seconds.
            </textarea>
            <textarea id="page"></textarea>
            <input type="button" id="nextPage" value=""
            onclick="changePage()" class="nextPage">
            <input type="button" id="previousPage" value=""
            onclick="changePage()" class="previousPage ">
        </main>
    </body>
</html>
