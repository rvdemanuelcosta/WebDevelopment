<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Página de login</title>
        <link rel="stylesheet" href="styles/header.css">
        <link rel="stylesheet" href="styles/loginFormStyles.css">
        <link rel="stylesheet" href="styles/footer.css">
    </head>
    <body>
        <header>
            <h1>Compartilho a tranquilidade</h1>
            <menu>
                <li>
                    <a href="index.html">
                        Página inicial
                    </a>
                </li>
                <li>
                    <a Href="Entrar">
                        Entrar
                    </a>
                </li>
            </menu>
            <hr>
        </header>
        <main>
            <section>
                <h1 class="centerText">Entrar na conta</h1>
                <p class="centerText">
                    Use seu email e senha para entrar no site.

                </p>
                <form action="index.html" method="POST">
                    <p>
                        <label for="user-e-mail">E-mail</label>
                        <input type="email" id="user-e-mail" 
                        name="namef-user-e-mail" required class="textBoxCenter">
                    </p>
                    
                    <p>
                        <label for="user-password">Senha</label>
                        <input type="password" id="user-password" 
                        name="namef-user-password" minlength="8"
                        maxlenght="32" required class="textBoxCenter">
                    </p>
                    <input type="submit" value="Entrar" class="loginbt">
                    
                    <p class="centerText">
                        <a href="#">Criar conta</a>
                        <a href="#">Recuperar conta</a>
                    </p>
                    
                </form>
            </section>
        </main>
        <footer>
            <p>Página criada por 
                <a href="https://github.com/rvdemanuelcosta">Emanuel Costa</a>
            </p>
        </footer>
    </body>
</html>
