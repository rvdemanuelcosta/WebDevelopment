<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widht=device-width, initial-scale=1.0">
    <title></title>
    <style>
        .header {
            display: flex;
            justify-content: center;
            background-color: dodgerblue;
            color: white;
        }
        .container {
            font-size: 25px;
            width: 500px;
        }
        .left {
            position: relative;
            top: 0px; left: 20%;
        }
        .right {
            position: relative;
            top: -100px; left: 50%;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>Login</h1>
    </div>
    <div class="container left">
        <p>Hello world</p>
        <p>this is the left container.</p>
    </div>
    <div class="container right">
        <p>Teste</p>
        <p>this is the right container.</p>
    </div>
</body>
</html>
