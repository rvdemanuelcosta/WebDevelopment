<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>login</title>
        <link rel="stylesheet" href="styles/header.css">
        <link rel="stylesheet" href="styles/loginFormStyles.css">
        <link rel="stylesheet" href="styles/footer.css">
        <script src="js/search-box.js"></script>
    </head>
    <body>
        <hr>
        <header>
            <a href="index.html" class="logo" id="h-logo">
                <h1 id="h-header">Seja zen</h1>
            </a>
            <div class="search-area" id="search-area">
                <input type="button" class="search-bt" id="cancel-search-bt"
                onclick="uiSearchToNor()">
                <input type="text" class="search-ifield" id="search-ifield">
                <input type="button" class="search-bt" onclick="uiNorToSearch()"
                id="start-search">
                <input type="button" class="search-bt" 
                id="end-search" onclick="searchInPage()">
            </div>
            <a class="menu" id="entrar" Href="login.html">Entrar</a>
        </header>
        <hr>
        <main>
            <section>
                <h1 class="centerText">Entrar na conta</h1>
                <section class="login-options">
                    <a href="#" class="optgoogle">Entre com a conta do google
                    </a>
                
                    <a href="#" class="optfacebook">Entre com a conta do facebook

                    </a>
                    <p>OU</p>
                </section>
                <p class="centerText">
                    Use seu email e senha para entrar no site.

                </p>
                <form action="index.html" method="POST" autocomplete="off">
                    <section class="textBoxBG">
                        <p>
                            <input type="email" id="user-e-mail"
                            name="namef-user-e-mail" required
                            class="textBoxCenter textbox" placeholder="E-mail">
                        </p>
                    </section>
                    
                    <section class="textBoxBG">
                        <p>
                            <input type="password" id="user-password"
                            name="namef-user-password" minlength="8"
                            maxlenght="32" required placeholder="Senha"
                            class="textBoxCenter textbox">
                        </p>
                    </section>
                    <input type="submit" value="Entrar" class="loginbt">
                    
                    <p class="centerText">
                        <a href="#">Criar conta</a>
                        <a href="#">Recuperar conta</a>
                    </p>
                    
                </form>
            </section>
        </main>
        <footer>
            <p>Página criada por 
                <a href="https://github.com/rvdemanuelcosta">Emanuel Costa</a>
            </p>
        </footer>
    </body>
</html>
