    <title>Document</title>
</head>
<body>
    <h1>Usando imagens de tamanho diferentes de acordo com o tamanho da tela</h1>
    <picture>
        <source media="(max-width: 720px)" srcset="peq.png" type="image/png">
        <source media="(max-width: 1300px)" srcset="med.png" type="image/png">
        <source media="(max-width: 1900px)" srcset="big.png" type="image/png">
        <img src="big.png" alt="grnade">
    </picture>
</body>
</html>
