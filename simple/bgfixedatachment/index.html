<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fundo fixo</title>
        <style>
            section {
                height: 500px;
            }
            .image{
                background-image: url("images/i1.jpg");
                background-attachment: fixed;
                background-size: cover;
                background-position: top;
            }
            .image2{
                background-image: url("images/i2.jpg");
                background-attachment: fixed;
                background-size: cover;
                background-position: top;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Fundo Fixo</h1>
        </header>
        <main>
            <section>
                <p>First section</p>
            </section>
            <section class="image">
                <p>2</p>
            </section>
            <section>
                <p>3</p>
            </section>
            <section class="image2">
                <p>Last</p>
            </section>
        </main>
        <footer>
            <p>Pagina criada por Emanuel Costa</p>
        </footer>
    </body>
</html>
