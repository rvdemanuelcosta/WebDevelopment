<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteiner e conteudo</title>
    <style>
        .conteiner{
            width: 500px;
            height: 500px;
            background-color: red;
            border: 2px solid black;
            position: relative;
        }
        .conteudo{
            width: 250px;
            height: 250px;
            background-color: white;
            border: 2px solid black;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        h1 {
            padding-top: 40%;
        }

    </style>
</head>
<body>
    <section class="conteiner">
        <article class="conteudo">
            <h1>center</h1>
        </article>
    </section>
</body>
</html>
