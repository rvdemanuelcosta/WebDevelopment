<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/mainStyle.css">
        <title>Calculadora simples</title>
    </head>
    <body>
        <main>
            <section class="calcBody">
                <section class="calcDisplay">
                    <p class="calcOutput">0123456789</p>
                </section>
                <section class="row">
                    <input type="button" value="7" id="bt7" class="bt">
                    <input type="button" value="8" id="bt8" class="bt">
                    <input type="button" value="9" id="bt9" class="bt">
                    <input type="button" value="4" id="bt4" class="bt">
                    <input type="button" value="5" id="bt5" class="bt">
                    <input type="button" value="6" id="bt6" class="bt">
                    <input type="button" value="1" id="bt1" class="bt">
                    <input type="button" value="2" id="bt2" class="bt">
                    <input type="button" value="3" id="bt3" class="bt">
                    <input type="button" value="0" id="bt0" class="bt doubW">
                    <input type="button" value="=" id="btEqual" class="bt">
                </section>
                <section class="col">
                    <input type="button" value="/" id="btDivide" class="bt">
                    <input type="button" value="X" id="btMultiply" class="bt">
                    <input type="button" value="+" id="btPlus" class="bt">
                    <input type="button" value="-" id="btMinus" class="bt">
                </section>
            </section>
        </main>
    </body>
</html>
